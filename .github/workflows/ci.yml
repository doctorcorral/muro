name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  elixir:
    name: Elixir
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.exs', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-

      - run: elixir --version
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix muro.check

  agda:
    name: Agda 2.8.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # agda-setup-action@v1 exits immediately on these runners.
      # Download the public asset without GITHUB_TOKEN: a repo-scoped token
      # 403s against agda/agda, and gh then saves an HTML error as the tarball.
      - name: Install Agda 2.8.0
        run: |
          set -euo pipefail
          trap 'echo "::error::agda install failed at line $LINENO exit $?"' ERR
          asset="Agda-v2.8.0-linux.tar.xz"
          curl -fL --retry 5 --retry-all-errors -o "$asset" \
            "https://github.com/agda/agda/releases/download/v2.8.0/${asset}"
          ls -lh "$asset"
          python3 -c 'import pathlib,sys; d=pathlib.Path(sys.argv[1]).read_bytes()[:6]; sys.exit(0 if d==b"\xfd7zXZ\x00" else 1)' "$asset"
          tar xf "$asset"
          chmod +x agda
          mkdir -p "$HOME/.local/bin"
          mv agda "$HOME/.local/bin/agda"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agda" --version
          "$HOME/.local/bin/agda" --setup

      - name: Fetch Agda standard library 2.3
        run: git clone --depth 1 --branch v2.3 https://github.com/agda/agda-stdlib.git vendor/agda-stdlib

      - uses: actions/cache@v5
        with:
          path: agda/_build
          key: agda-${{ runner.os }}-2.8.0-stdlib-2.3-${{ hashFiles('agda/**/*.agda', 'agda/**/*.agda-lib') }}
          restore-keys: |
            agda-${{ runner.os }}-2.8.0-stdlib-2.3-

      # Same flags as `make agda`: --no-libraries so extra .agda-lib files
      # shipped with the stdlib checkout (tests, docs) are not loaded.
      - run: make agda
